[build-system]
requires = ["scikit-build-core", "pybind11"]
build-backend = "scikit_build_core.build"

[project]
name = "TracerLL"
version = "0.3.0"
description = "TracerLL: High-performance embedded variable tracing library"
authors = [
    { name = "Jos Wigchert", email = "joswigchert@integralmotions.com" },
    { name = "William Kers", email = "williamkers@integralmotions.com" },
]
readme = "README.md"
license = { text = "MIT" }
dependencies = []
requires-python = ">=3.12"

[project.optional-dependencies]
test = ["pytest"]

[tool.scikit-build]
minimum-version = "0.10"
wheel.packages = ["src/TracerLL"]

[tool.cibuildwheel]
skip = "cp36-* cp37-* cp38-* cp39-* cp310-* cp311-* pp*"
archs = "auto"
