name: Build and Publish Wheels

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/unit-tests.yml

  serial-integration:
    uses: ./.github/workflows/serial-integration.yml
    secrets:
      DEPENDENCY_TOKEN: ${{ secrets.DEPENDENCY_TOKEN }}

  build:
    name: Build wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [test, serial-integration]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install wheel builder
        run: python -m pip install --upgrade cibuildwheel

      - name: Build wheels
        env:
          CIBW_BUILD: "cp312-* cp313-* cp314-* cp315-*"
        run: python -m cibuildwheel --output-dir dist

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: dist/

  publish:
    name: Publish wheels
    runs-on: ubuntu-latest
    needs: build
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist/

      - uses: actions/setup-python@v5
        with:
          python-version: "3.15"

      - name: Install publisher
        run: python -m pip install --upgrade twine

      - name: Publish wheels
        env:
          TWINE_REPOSITORY: pypi
        run: python -m twine upload dist/*
