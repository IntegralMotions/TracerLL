name: Serial integration

on:
  workflow_call:

permissions:
  contents: read

jobs:
  serial-integration:
    name: Serial integration (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out TracerLL
        uses: actions/checkout@v4
        with:
          path: tracerll

      # This ref must contain the example, including its Windows COM-port support.
      - name: Check out IntegralEmbeddedTracing
        uses: actions/checkout@v4
        with:
          repository: IntegralMotions/IntegralEmbeddedTracing
          ref: feature/add-integration-test-code
          token: ${{ secrets.DEPENDENCY_TOKEN }}
          persist-credentials: false
          path: embedded-tracing

      # Match the CoreUtilities version pinned by IntegralCommunication v0.5.2.
      - name: Check out IntegralCoreUtilities
        uses: actions/checkout@v4
        with:
          repository: IntegralMotions/IntegralCoreUtilities
          ref: v0.3.1
          token: ${{ secrets.DEPENDENCY_TOKEN }}
          persist-credentials: false
          path: core-utilities

      - uses: actions/setup-python@v5
        with:
          python-version: "3.15"

      - name: Install TracerLL and pytest
        working-directory: tracerll
        run: python -m pip install -e ".[test]"

      - name: Build trace device
        shell: bash
        run: |
          cmake -S embedded-tracing -B embedded-build -DINTEGRAL_BUILD_TESTS=OFF -DINTEGRAL_BUILD_EXAMPLES=ON \
            -DFETCHCONTENT_SOURCE_DIR_INTEGRALCOREUTILITIES="$GITHUB_WORKSPACE/core-utilities"
          cmake --build embedded-build --config Release --target TracingSerialDevice --parallel

      - name: Install and configure com0com
        if: runner.os == 'Windows'
        timeout-minutes: 6
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'com0com.zip'
          # Fresh installs of signed com0com 3.0 have reported Windows 10/11 issues.
          # https://docklight.de/dl_prb059/ recommends the signed 2.2.2 package.
          $expected = '3bc7313e8577774ce78cff4d1c816faf96cfa48c485bbcc5527d4569f7d5e373'
          $path = 'project/com0com/com0com/2.2.2.0/com0com-2.2.2.0-x64-fre-signed.zip'
          $urls = @("https://netix.dl.sourceforge.net/$path", "https://downloads.sourceforge.net/$path")
          $verified = $false
          foreach ($url in $urls) {
            Write-Host "Downloading com0com from $url"
            Remove-Item $archive -Force -ErrorAction SilentlyContinue
            & curl.exe --fail --location --retry 2 --connect-timeout 20 --max-time 120 --output $archive $url
            if ($LASTEXITCODE -ne 0 -or -not (Test-Path $archive)) {
              Write-Warning "Download failed with exit code $LASTEXITCODE"
              continue
            }
            $actual = (Get-FileHash $archive -Algorithm SHA256).Hash
            $size = (Get-Item $archive).Length
            if ($actual -eq $expected) { $verified = $true; break }
            Write-Warning "Discarding unexpected response: $size bytes, SHA-256 $actual"
          }
          if (-not $verified) { throw 'Could not download the verified com0com archive from any configured mirror' }
          Write-Host "Verified com0com archive (SHA-256 $actual, $size bytes)"
          $dir = Join-Path $env:RUNNER_TEMP 'com0com'
          Expand-Archive $archive -DestinationPath $dir
          $installer = Join-Path $dir 'com0com-2.2.2.0-x64-fre-signed\setup.exe'
          Write-Host 'Starting the silent com0com installer (timeout: 120 seconds)'
          $result = Start-Process $installer -ArgumentList '/S' -PassThru
          if (-not $result.WaitForExit(120000)) {
            & taskkill.exe /PID $result.Id /T /F
            throw 'com0com installer timed out. It may be waiting for driver installation or an interactive prompt.'
          }
          if ($result.ExitCode -ne 0) { throw "com0com installer failed: $($result.ExitCode)" }
          Write-Host 'com0com installer completed'
          $setup = Get-ChildItem "${env:ProgramFiles(x86)}\com0com", "$env:ProgramFiles\com0com" -Filter setupc.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $setup) { throw 'com0com setupc.exe not found after installation' }
          function Invoke-Setup([string[]] $Arguments) {
            Write-Host "Running setupc $($Arguments -join ' ') (timeout: 60 seconds)"
            $proc = Start-Process -FilePath $setup.FullName -ArgumentList $Arguments -NoNewWindow -PassThru
            if (-not $proc.WaitForExit(60000)) {
              & taskkill.exe /PID $proc.Id /T /F
              throw "com0com setupc timed out: $($Arguments -join ' ')"
            }
            if ($proc.ExitCode -ne 0) { throw "com0com setupc failed with exit code $($proc.ExitCode)" }
          }
          Invoke-Setup @('install', 'PortName=COM30', 'PortName=COM31')
          Invoke-Setup @('list')
          $ready = $false
          for ($i = 0; $i -lt 30; $i++) {
            $entry = Get-ItemProperty 'HKLM:\HARDWARE\DEVICEMAP\SERIALCOMM' -ErrorAction SilentlyContinue
            $ports = if ($entry) { @($entry.PSObject.Properties | ForEach-Object { $_.Value }) } else { @() }
            if ($ports -contains 'COM30' -and $ports -contains 'COM31') { $ready = $true; break }
            Start-Sleep -Seconds 1
          }
          if (-not $ready) { throw 'COM30 and COM31 did not become available; check driver signature and installation' }

      - name: Run serial integration (Linux and macOS)
        if: runner.os != 'Windows'
        working-directory: tracerll
        run: python tests/integration/run_virtual_device.py ../embedded-build/TracingSerialDevice

      - name: Run serial integration (Windows)
        if: runner.os == 'Windows'
        working-directory: tracerll
        run: python tests/integration/run_virtual_device.py ../embedded-build/Release/TracingSerialDevice.exe --device-port COM30 --host-port COM31

      - name: Install Windows serial test dependency
        if: runner.os == 'Windows'
        run: python -m pip install pyserial

      - name: Run native transport tests (Windows COM pair)
        if: runner.os == 'Windows'
        working-directory: tracerll
        env:
          TRACER_TEST_PORT_A: COM30
          TRACER_TEST_PORT_B: COM31
        run: python -m pytest -v tests/test_native_concurrency.py
