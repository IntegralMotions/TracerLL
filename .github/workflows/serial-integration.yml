name: Serial integration

on:
  workflow_call:
    secrets:
      DEPENDENCY_TOKEN:
        description: Read access to the private IntegralCoreUtilities repository
        required: true

permissions:
  contents: read

jobs:
  serial-integration:
    name: Serial integration (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: tracerll
    steps:
      - name: Check out TracerLL
        uses: actions/checkout@v4
        with:
          path: tracerll

      - name: Check out IntegralEmbeddedTracing
        uses: actions/checkout@v4
        with:
          repository: IntegralMotions/IntegralEmbeddedTracing
          # Switch to main once the example branch is merged.
          ref: feature/add-integration-test-code
          token: ${{ secrets.DEPENDENCY_TOKEN }}
          persist-credentials: false
          path: embedded-tracing

      - name: Check out IntegralCoreUtilities
        uses: actions/checkout@v4
        with:
          repository: IntegralMotions/IntegralCoreUtilities
          # Matches IntegralCommunication v0.5.2's dependency.
          ref: v0.3.1
          token: ${{ secrets.DEPENDENCY_TOKEN }}
          persist-credentials: false
          path: core-utilities

      - uses: actions/setup-python@v5
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: tracerll/pyproject.toml

      - name: Install package and test dependencies
        run: python -m pip install -e ".[test]"

      - name: Build trace device
        working-directory: .
        shell: bash
        run: |
          cmake -S embedded-tracing -B embedded-build -DINTEGRAL_BUILD_TESTS=OFF -DINTEGRAL_BUILD_EXAMPLES=ON \
            -DFETCHCONTENT_SOURCE_DIR_INTEGRALCOREUTILITIES="$GITHUB_WORKSPACE/core-utilities"
          cmake --build embedded-build --config Release --target TracingSerialDevice --parallel

      - name: Install and configure com0com
        if: runner.os == 'Windows'
        timeout-minutes: 6
        shell: pwsh
        run: ./.github/scripts/com0com.ps1 -Action Install

      - name: Run serial integration (Linux and macOS)
        if: runner.os != 'Windows'
        run: python tests/integration/run_virtual_device.py ../embedded-build/TracingSerialDevice

      - name: Run serial integration (Windows)
        if: runner.os == 'Windows'
        run: python tests/integration/run_virtual_device.py ../embedded-build/Release/TracingSerialDevice.exe --device-port COM30 --host-port COM31

      - name: Install Windows serial test dependency
        if: runner.os == 'Windows'
        run: python -m pip install pyserial

      - name: Run native transport tests (Windows COM pair)
        if: runner.os == 'Windows'
        env:
          TRACER_TEST_PORT_A: COM30
          TRACER_TEST_PORT_B: COM31
        run: python -m pytest -v tests/test_native_concurrency.py

      - name: Remove temporary com0com publisher trust
        if: always() && runner.os == 'Windows' && env.COM0COM_ADDED_PUBLISHER != ''
        shell: pwsh
        run: ./.github/scripts/com0com.ps1 -Action Cleanup

      - name: Collect Windows driver diagnostics
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: ./.github/scripts/com0com.ps1 -Action Diagnostics

      - name: Upload Windows driver diagnostics
        if: failure() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-com0com-diagnostics
          path: ${{ runner.temp }}/com0com-diagnostics
